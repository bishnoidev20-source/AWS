
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration Form</title>
    <link rel="stylesheet" href="registration.css">
</head>
<body>

    <header>
        <h1>Student Registration</h1>
        <p>Fill in the form to register</p>
    </header>

    <nav>
        <a href="index.html">Home</a>
        <a href="#registration">Registration</a>
    </nav>

    <div class="container" id="registration">

        <h2>Create Your Account</h2>
        <p class="subtitle">Please enter your details below.</p>

        <form action="#" method="post">

            <div class="form-group">
                <label for="fullname">Full Name</label>
                <input type="text" id="fullname" name="fullname"
                       placeholder="Enter your full name" required>
            </div>

            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" name="email"
                       placeholder="Enter your email" required>
            </div>

            <div class="form-group">
                <label for="phone">Phone Number</label>
                <input type="tel" id="phone" name="phone"
                       placeholder="Enter your phone number"
                       pattern="[0-9]{10}" maxlength="10" required>
            </div>

            <div class="form-group">
                <label for="dob">Date of Birth</label>
                <input type="date" id="dob" name="dob" required>
            </div>

            <div class="form-group">
                <label for="gender">Gender</label>
                <select id="gender" name="gender" required>
                    <option value="">Select Gender</option>
                    <option value="male">Male</option>
                    <option value="female">Female</option>
                    <option value="other">Other</option>
                    <option value="prefer-not-to-say">
                        Prefer not to say
                    </option>
                </select>
            </div>

            <div class="form-group">
                <label for="course">Course</label>
                <select id="course" name="course" required>
                    <option value="">Select Course</option>
                    <option value="cse">B.Tech CSE</option>
                    <option value="cse ai">B.Tech CSE (AI)</option>
                    <option value="it">B.Tech IT</option>
                    <option value="ece">B.Tech ECE</option>
                    <option value="mechanical">B.Tech Mechanical</option>
                    <option value="civil">B.Tech Civil</option>
                </select>
            </div>

            <div class="form-group">
                <label for="college">College Name</label>
                <input type="text" id="college" name="college"
                       placeholder="Enter your college name" required>
            </div>

            <div class="form-group">
                <label for="password">Create Password</label>
                <input type="password" id="password" name="password"
                       placeholder="Create a password"
                       minlength="8" required>
            </div>

            <div class="form-group checkbox">
                <input type="checkbox" id="terms" name="terms" required>
                <label for="terms">
                    I confirm that the information provided is correct.
                </label>
            </div>

            <button type="submit">Register Now</button>

            <p class="login-text">
                Already have an account?
                <a href="login.html">Login here</a>
            </p>

        </form>

    </div>

    <footer>
        <p>© 2026 Student Registration Page</p>
    </footer>

</body>
</html>
